services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sales_manager
      MYSQL_USER: sales
      MYSQL_PASSWORD: sales
      MYSQL_ROOT_PASSWORD: root
    volumes: [mysql_data:/var/lib/mysql]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      APP_KEY: base64:CHANGE_ME
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sales_manager
      DB_USERNAME: sales
      DB_PASSWORD: sales
      JWT_SECRET: CHANGE_ME
      APP_ENV: production
    depends_on: [mysql]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
